# Agent: Dependency Advisories — iterated skill loop
#
# Weekly upkeep that clears `bun audit` advisories while they are still moderate, so the
# `high` gate in `verify` stays permanently clean. The severity gap is deliberate and is
# explained in ci.yml and in the skill: CI must not block clinical work over a moderate
# advisory in a transitive dev dependency, but something still has to clear them.
#
# Two modes:
#  1. schedule / workflow_dispatch — branch, run the agent, open a PR.
#  2. /iterate — a maintainer comments on the agent's PR and the agent updates it in place.
#
# The /iterate path checks the hidden PR body marker BEFORE checkout so that other agent
# workflows listening for the same command no-op cheaply.
#
# This workflow only ever opens a PR. It never pushes to main and never merges, so the
# repo's "no commit or push without explicit human authorization" rule is satisfied by the
# review the PR requires.

name: 'Agent: Dependency Advisories'

on:
  schedule:
    - cron: '0 1 * * 1' # Mondays 09:00 MYT (01:00 UTC)
  workflow_dispatch:
    inputs:
      target_path:
        description: 'Optional package or workspace to start from'
        required: false
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: agent-dependency-advisories
  cancel-in-progress: true

jobs:
  agent-task:
    if: |
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/iterate') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Mirrors the `verify` job. `bun run test` exercises a real database rather than
    # mocking it, so the agent cannot validate its own bumps without one.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-not-used-anywhere-real-000000
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: qwen
      DEID_FAIL_CLOSED: 'true'

    steps:
      - name: Check iterate marker and bound work-in-progress
        id: agent_gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
          WORKFLOW_ID: agent-dependency-advisories
          AGENT_LABEL: 'agent:deps'
        run: |
          # Scheduled runs no-op when this loop already has an open PR awaiting review.
          if [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_call" ]; then
            EXISTING_PR=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$AGENT_LABEL" --json number,url --limit 1)
            if [ "$(echo "$EXISTING_PR" | jq 'length')" -gt 0 ]; then
              echo "run_agent=false" >> "$GITHUB_OUTPUT"
              echo "Open PR already exists for $AGENT_LABEL; no-op."
              exit 0
            fi
          fi

          # Manual dispatch bypasses the bound on purpose.
          if [ "$EVENT_NAME" != "issue_comment" ]; then
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_DATA=$(gh api "$PR_URL")
          BODY=$(echo "$PR_DATA" | jq -r '.body // ""')
          if grep -Fq "<!-- codelayer-agent:workflow=$WORKFLOW_ID;" <<< "$BODY"; then
            echo "run_agent=true" >> "$GITHUB_OUTPUT"
            echo "number=$(echo "$PR_DATA" | jq -r '.number')" >> "$GITHUB_OUTPUT"
            echo "head_ref=$(echo "$PR_DATA" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$PR_DATA" | jq -r '.head.sha')" >> "$GITHUB_OUTPUT"
          else
            echo "run_agent=false" >> "$GITHUB_OUTPUT"
            echo "PR was not created by $WORKFLOW_ID; no-op."
          fi

      - uses: actions/checkout@v5
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name != 'issue_comment'
        with:
          fetch-depth: 0

      - uses: actions/checkout@v5
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name == 'issue_comment'
        with:
          ref: ${{ steps.agent_gate.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure git user and branch
        if: steps.agent_gate.outputs.run_agent == 'true'
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "issue_comment" ]; then
            BRANCH="agent/deps/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
            git checkout -b "$BRANCH"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: oven-sh/setup-bun@v2
        if: steps.agent_gate.outputs.run_agent == 'true'
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        if: steps.agent_gate.outputs.run_agent == 'true'
        with:
          node-version: 24

      - name: Cache bun dependencies
        if: steps.agent_gate.outputs.run_agent == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        if: steps.agent_gate.outputs.run_agent == 'true'
        run: bun install --frozen-lockfile

      - name: Prepare the throwaway database
        if: steps.agent_gate.outputs.run_agent == 'true'
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma

      - name: Install Claude Code
        if: steps.agent_gate.outputs.run_agent == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run coding agent
        if: steps.agent_gate.outputs.run_agent == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_PATH: ${{ github.event.inputs.target_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ steps.agent_gate.outputs.number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -o pipefail

          MEMORY_CONTENT="$(cat .github/agent-memory/dependency-advisories.md)"

          if [ "${{ github.event_name }}" = "issue_comment" ]; then
            bun .github/scripts/agent-iteration.ts \
              --command prompt \
              --workflow agent-dependency-advisories \
              --memory .github/agent-memory/dependency-advisories.md \
              --repo "$GITHUB_REPOSITORY" \
              --pr-number "$PR_NUMBER" \
              --comment-body "$COMMENT_BODY" > /tmp/agent-prompt.md

            claude -p "$(cat /tmp/agent-prompt.md)" \
              --model claude-sonnet-5 \
              --permission-mode bypassPermissions \
              --output-format stream-json \
              --verbose \
              --max-turns 80 \
              2>&1 | tee /tmp/agent-output.txt

            cat /tmp/agent-output.txt \
              | grep '^{' \
              | jq -s '[.[] | select(.type == "assistant" and .message.content)] | last | .message.content[] | select(.type == "text") | .text' -r \
              > /tmp/pr-body.md
            exit 0
          fi

          TARGET_INSTRUCTION=""
          if [ -n "$TARGET_PATH" ]; then
            TARGET_INSTRUCTION="

          ## Target Request

          The user requested this path or package: $TARGET_PATH

          Start there instead of picking a target automatically."
          fi

          PROMPT="$(cat <<EOF
          # Context

          You are clearing dependency security advisories in this repository. Begin by using
          the \`upkeep-dependency-advisories\` skill in \`.claude/skills/\`.

          This is an AI clinical assistant handling simulated patient data. \`AGENTS.md\`
          holds the project's conventions and its clinical-safety do-nots. Read it before
          you change anything.

          # Scope

          You may change dependency manifests: the root \`package.json\`, \`backend/package.json\`,
          \`frontend/package.json\`, \`shared/package.json\`, and \`bun.lock\` (via \`bun install\`,
          never by hand).

          You may change source under \`backend/\`, \`frontend/\`, and \`shared/\` ONLY where a
          version bump forces an API adaptation, and you must report each such change with a
          risk level.

          You may NOT change, for any reason:
          - \`backend/src/deid/\` — the PHI trust boundary and token vault
          - \`backend/src/redflags/\` — the deterministic clinical escalation engine
          - \`prisma/schema.prisma\` and \`prisma/migrations/\`
          - \`.github/workflows/\`, \`vercel.json\`, \`render.yaml\`

          If clearing an advisory would require touching any of those, report it as SKIPPED.
          That is a correct outcome.
          ${TARGET_INSTRUCTION}

          # Instructions

          1. Run \`bun audit --audit-level=moderate\` and record every advisory it reports.
          2. For each, read the linked GHSA advisory and find the smallest version change
             that clears it — direct bump first, parent bump second, root \`overrides\` last.
          3. Apply the bumps and run \`bun install\` to regenerate the lockfile. Never run
             \`bun update --latest\`.
          4. Validate with the commands below, in order.
          5. If one bump breaks the suite and the fix is not small and obvious, revert that
             single bump and report it as SKIPPED. A PR clearing three of four advisories
             beats a broken one attempting all four.
          6. Commit with a Conventional Commits message (\`chore(deps): ...\`, imperative,
             no trailing period) and push.

          ## Validation Commands

          \`\`\`bash
          bun install
          bunx prisma generate --schema prisma/schema.prisma
          bun run lint
          bun run typecheck
          bun run test
          bun audit --audit-level=moderate
          \`\`\`

          ## Important Rules

          - Every version change must trace to a specific advisory in this run's audit output.
            An old dependency with no advisory is not in scope.
          - Never remove an existing \`overrides\` entry because its advisory no longer appears.
            It does not appear because the override is working.
          - Never put the client name, a fee figure, or an engagement length in a commit
            message, branch name, or PR body. The \`verify\` job's confidentiality check scans
            for them.
          - Do not run long integration suites beyond \`bun run test\`.
          - You are running unattended on a CI runner. Do not stop to ask for approval.

          ## Agent Memory

          $MEMORY_CONTENT

          ## Finishing Up

          1. Make sure the validation commands pass, or name the exact one that did not.
          2. Commit and push your changes.
          3. Answer in the format defined by
             \`.claude/skills/upkeep-dependency-advisories/references/response-template.md\`.
             Your answer becomes the PR body.
          EOF
          )"

          claude -p "$PROMPT" \
            --model claude-sonnet-5 \
            --permission-mode bypassPermissions \
            --output-format stream-json \
            --verbose \
            --max-turns 80 \
            2>&1 | tee /tmp/agent-output.txt

      - name: Extract PR body
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name != 'issue_comment'
        run: |
          cat /tmp/agent-output.txt \
            | grep '^{' \
            | jq -s '[.[] | select(.type == "assistant" and .message.content)] | last | .message.content[] | select(.type == "text") | .text' -r \
            > /tmp/pr-body.md

          if [ ! -s /tmp/pr-body.md ]; then
            echo "The agent produced no final message; see the agent-output artifact." > /tmp/pr-body.md
          fi

      - name: Push and open PR
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name != 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENT_LABEL: 'agent:deps'
          WORKFLOW_ID: agent-dependency-advisories
        run: |
          if git diff --quiet origin/main...HEAD; then
            echo "The agent created no commits; nothing to open a PR for."
            exit 0
          fi

          git push --set-upstream origin "${{ env.BRANCH }}"

          bun .github/scripts/agent-iteration.ts \
            --command footer \
            --workflow "$WORKFLOW_ID" \
            --memory .github/agent-memory/dependency-advisories.md >> /tmp/pr-body.md

          gh label create "$AGENT_LABEL" --description "Recurring dependency-advisory agent PR" --color "586069" || true

          # Conventional Commits, because commitlint runs on the squash-merge subject.
          PR_URL=$(gh pr create \
            --title "chore(deps): clear the advisories bun audit reported on $(date +%Y-%m-%d)" \
            --body-file /tmp/pr-body.md)
          gh pr edit "$PR_URL" --add-label "$AGENT_LABEL" --add-label "area:infra"

      - name: Push iteration changes and comment
        if: steps.agent_gate.outputs.run_agent == 'true' && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet HEAD; then
            git add -A
            git commit -m "chore(deps): apply reviewer feedback from the iterate comment"
            git push origin HEAD:${{ steps.agent_gate.outputs.head_ref }}
          fi

          gh pr comment ${{ steps.agent_gate.outputs.number }} --body-file /tmp/pr-body.md

      - name: Upload agent output
        if: always() && steps.agent_gate.outputs.run_agent == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: agent-output
          path: /tmp/agent-output.txt
