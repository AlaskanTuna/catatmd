name: CI

# Reinstated 13/08/26 (TRD §19 row 12) as part of issue #13. The clinical-safety
# acceptance suite exists so that a regression fails a build rather than
# reaching a demo — running it only on a developer's machine defeats the point.

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled on pull requests, where only the latest commit
# matters, but never on `main`, because a run on `main` deploys.
#
# Observed on the first run after #52 merged: a push two minutes later cancelled
# the in-flight deploy. Cancelling `verify` is free; cancelling a deploy is not,
# because the window between `vercel deploy` and the assertions that follow it is
# exactly where a half-finished deploy leaves the production alias pointing at an
# unverified build. That is the failure the job exists to detect, so the job must
# not be able to cause it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres, because the route and auth suites exercise real
    # ownership scoping and audit writes rather than mocking the database —
    # which is the point of them. It is never the shared Supabase instance.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No LLM provider key. LLM-dependent tests stub at the `LLMClient` port —
    # the same boundary that makes the provider swappable. A test needing a real
    # key would leak cost and non-determinism into CI.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-not-used-anywhere-real-000000
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: qwen
      DEID_FAIL_CLOSED: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Generate Prisma client and apply migrations to the throwaway database
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma

      - run: bun run lint

      - run: bun run typecheck

      - name: Test, including the clinical-safety acceptance suite
        run: bun run test

      - name: Confidentiality check
        # Engagement terms must never reach a tracked file. The submission URL
        # is the one authorised exception and is filtered out.
        run: |
          if git ls-files -z | xargs -0 grep -sInIiE "kabel|RM ?3,?000|8-week" \
            | grep -v "dxp\.kabel\.my/candidate/projects" \
            | grep -v "kickoff-.*-session\.md" \
            | grep -v "\.github/workflows/ci\.yml"; then
            echo "::error::Confidential engagement details found in tracked files"
            exit 1
          fi
          echo "CLEAN"

  # ── Deploy ──────────────────────────────────────────────────────────────────
  # Deployment moved off Vercel's Git integration and behind this job for two
  # reasons, both observed rather than theorised:
  #
  #  1. Git-integration deploys were blocked outright for one collaborator. The
  #     project is on a Hobby plan, which only builds commits authored by the
  #     account owner, so a push from the other contributor failed with
  #     TEAM_ACCESS_REQUIRED (13/08/26, commit c2321c4). A token-authenticated
  #     CLI deploy is attributed to the token owner, so authorship stops
  #     mattering.
  #  2. Git-integration deploys ignored CI. A red build shipped, and worse, a
  #     green build silently did not: after #50 merged, Vercel reported the
  #     deployment Ready while catatmd.vercel.app kept serving the previous
  #     build. `vercel promote` then returned 409 "already the current
  #     production deployment" because Vercel believed it had shipped. It had
  #     not, and nothing anywhere reported an error. The alias had to be moved
  #     by hand. That is why this job asserts what the domain actually serves
  #     rather than trusting the deploy step's exit code.
  deploy:
    name: Deploy to Vercel
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Identifiers, not credentials: they appear in Vercel dashboard URLs.
      # Only VERCEL_TOKEN is secret, which keeps the setup burden to one secret.
      VERCEL_ORG_ID: team_CwktsdBSB9TLrdwdCV3dZRbg
      VERCEL_PROJECT_ID: prj_6QNJo1XWj70DACDO3F0ICVSJkQTF
      # The domain a reviewer actually visits, and the origin the API trusts for
      # CORS and cookies (docs/trd.md §14). Asserting against the deployment's
      # own URL would prove nothing: that URL always resolves to the deployment.
      PRODUCTION_DOMAIN: catatmd.vercel.app

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Pinned rather than @latest: the deploy path should not change under us
      # between one merge and the next.
      - name: Install Vercel CLI
        run: npm install --global vercel@54.12.0

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Builds with the settings just pulled, so CI cannot drift from what the
      # dashboard would have done. The build command itself lives in
      # vercel.json, in the repo, rather than in dashboard state.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # `--meta commitSha` is set explicitly rather than relying on the CLI's git
      # auto-detection, because the identity check below reads it back and must
      # not depend on how the CLI happened to infer provenance.
      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod \
            --meta commitSha="$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # The step the whole job exists for.
      #
      # `vercel deploy --prod` creates a production deployment but does not
      # reliably move the production alias onto it. Observed three times on
      # 13/08/26: `vercel promote` returning 409 while the domain served an older
      # build, an older tree taking the alias from a newer deployment, and a run
      # where a correct new deployment was created and the alias simply stayed
      # where it was. So "the deploy command exited 0" says nothing about what
      # the domain serves, and this asserts the thing that actually matters.
      #
      # Identity, not content, is the primary check, and it drives the repair.
      # Content alone is insufficient: a backend-only or docs-only commit
      # produces a byte-identical bundle, so a stale alias still serves the
      # expected hash. Comparing deployment ids is exact in both directions, and
      # it stays correct if Vercel ever deduplicates an identical build, because
      # the deploy step then returns that same deployment and the ids still match.
      - name: Assert the production domain serves this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$1"; }
          host="${DEPLOYMENT_URL#https://}"

          deployed_id="$(api \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" \
            | jq -r '.id // empty')"
          if [ -z "$deployed_id" ]; then
            echo "::error::Could not resolve the deployment just created ($host)"
            exit 1
          fi
          echo "Deployed $deployed_id from $GITHUB_SHA"

          alias_target() {
            api "https://api.vercel.com/v4/aliases/$PRODUCTION_DOMAIN?teamId=$VERCEL_ORG_ID" \
              | jq -r '.deploymentId // empty'
          }

          # Aliasing is not instant, so a first miss is not yet a failure.
          for _ in 1 2 3 4 5 6; do
            [ "$(alias_target)" = "$deployed_id" ] && {
              echo "$PRODUCTION_DOMAIN resolves to this deployment."
              exit 0
            }
            sleep 10
          done

          # Reached whenever the deploy succeeded but the alias stayed put, which
          # is the normal case rather than the exception. Repair explicitly.
          echo "::warning::Alias did not move on its own; repointing $PRODUCTION_DOMAIN"
          vercel alias set "$DEPLOYMENT_URL" "$PRODUCTION_DOMAIN" --token="$VERCEL_TOKEN"

          for _ in 1 2 3 4 5 6; do
            [ "$(alias_target)" = "$deployed_id" ] && {
              echo "$PRODUCTION_DOMAIN resolves to this deployment after an explicit alias set."
              exit 0
            }
            sleep 10
          done

          live="$(alias_target)"
          echo "::error::$PRODUCTION_DOMAIN still resolves to ${live:-an unknown deployment}, not $deployed_id. The deploy reported success and the alias could not be moved onto it."
          exit 1

      # Confirmation, not the gate. If the ids match but the bytes do not, the
      # deployment itself is wrong rather than the alias, which is a different
      # fault and worth naming separately.
      - name: Confirm the served bundle matches the build
        run: |
          set -euo pipefail

          expected="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' \
            .vercel/output/static/index.html | head -1)"
          if [ -z "$expected" ]; then
            echo "::warning::Could not fingerprint the build output; skipping byte confirmation"
            exit 0
          fi

          for _ in 1 2 3; do
            if curl -fsSL --max-time 20 "https://$PRODUCTION_DOMAIN/" | grep -qF "$expected"; then
              echo "$PRODUCTION_DOMAIN serves $expected."
              exit 0
            fi
            sleep 10
          done

          echo "::error::$PRODUCTION_DOMAIN resolves to the right deployment but is not serving $expected."
          exit 1
