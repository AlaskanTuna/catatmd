name: CI

# Reinstated 13/08/26 (TRD §19 row 12) as part of issue #13. The clinical-safety
# acceptance suite exists so that a regression fails a build rather than
# reaching a demo — running it only on a developer's machine defeats the point.

on:
  push:
    branches: [main]
  pull_request:

# Superseded runs are cancelled on pull requests, where only the latest commit
# matters, but never on `main`, because a run on `main` deploys.
#
# Observed on the first run after #52 merged: a push two minutes later cancelled
# the in-flight deploy. Cancelling `verify` is free; cancelling a deploy is not,
# because the window between `vercel deploy` and the assertions that follow it is
# exactly where a half-finished deploy leaves the production alias pointing at an
# unverified build. That is the failure the job exists to detect, so the job must
# not be able to cause it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # A throwaway Postgres, because the route and auth suites exercise real
    # ownership scoping and audit writes rather than mocking the database —
    # which is the point of them. It is never the shared Supabase instance.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # No LLM provider key. LLM-dependent tests stub at the `LLMClient` port —
    # the same boundary that makes the provider swappable. A test needing a real
    # key would leak cost and non-determinism into CI.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      BETTER_AUTH_SECRET: ci-secret-not-used-anywhere-real-000000
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:5173
      LLM_PROVIDER: qwen
      DEID_FAIL_CLOSED: 'true'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Audit dependencies for known vulnerabilities
        # OWASP A03:2025 Software Supply Chain Failures. Gated at `high` rather
        # than `low` so a moderate advisory in a transitive dev dependency does
        # not block clinical work, while the severities that would actually
        # matter in a PHI-handling service still fail the build. Clean at the
        # time this was added, so it starts enforcing rather than warning.
        run: bun audit --audit-level=high

      - name: Generate Prisma client and apply migrations to the throwaway database
        run: |
          bunx prisma generate --schema prisma/schema.prisma
          bunx prisma migrate deploy --schema prisma/schema.prisma

      - run: bun run lint

      - run: bun run typecheck

      - name: Test, including the clinical-safety acceptance suite
        run: bun run test

      - name: Confidentiality check
        # Engagement terms must never reach a tracked file. The submission URL
        # is the one authorised exception and is filtered out.
        run: |
          if git ls-files -z | xargs -0 grep -sInIiE "kabel|RM ?3,?000|8-week" \
            | grep -v "dxp\.kabel\.my/candidate/projects" \
            | grep -v "kickoff-.*-session\.md" \
            | grep -v "\.github/workflows/ci\.yml"; then
            echo "::error::Confidential engagement details found in tracked files"
            exit 1
          fi
          echo "CLEAN"

  # ── Deploy ──────────────────────────────────────────────────────────────────
  # Deployment moved off Vercel's Git integration and behind this job for two
  # reasons, both observed rather than theorised:
  #
  #  1. Git-integration deploys were blocked outright for one collaborator. The
  #     project is on a Hobby plan, which only builds commits authored by the
  #     account owner, so a push from the other contributor failed with
  #     TEAM_ACCESS_REQUIRED (13/08/26, commit c2321c4).
  #
  #     This job was originally written on the assumption that a
  #     token-authenticated CLI deploy is attributed to the token owner, so
  #     authorship would stop mattering. That assumption is wrong, and the
  #     evidence is in the deployment record: the CLI attaches the checkout's
  #     git metadata, and Vercel applies the same author restriction to it.
  #     Of the last 100 deployments, every BLOCKED one was authored by a
  #     non-owner and every owner-authored one built, across both paths. So a
  #     merge of a collaborator-authored commit still does not reach
  #     production. Moving deployment here did fix reason 2 below and made the
  #     failure visible instead of silent, but the plan limit needs a plan
  #     decision.
  #  2. Git-integration deploys ignored CI. A red build shipped, and worse, a
  #     green build silently did not: after #50 merged, Vercel reported the
  #     deployment Ready while catatmd.vercel.app kept serving the previous
  #     build. That is why this job asserts what the domain actually serves
  #     rather than trusting the deploy step's exit code.
  # A deployment is a metered resource on this plan (100 per rolling 24 hours),
  # and exceeding it does not fail loudly: Vercel returns `BLOCKED` with a null
  # `errorCode`, a null `errorMessage` and a 0ms build, while the CLI prints
  # "Your deployment failed. Please retry later." That reads like a build
  # failure, so the natural response is to retry, which spends another slot and
  # cannot succeed. Observed 14/08/26 at 97 of 100 (GitHub issue #82).
  #
  # Most of that budget went on commits that could not change the bundle. A
  # docs-only change ran `vercel pull`, `build` and `deploy` to ship a
  # byte-identical frontend. This job decides whether the push touched anything
  # the deployed artefact is built from.
  #
  # It fails OPEN. If the previous commit cannot be resolved, which happens on a
  # first push, a force push, or a re-run after history moved, it deploys. A
  # wasted deployment costs one slot; a skipped one silently leaves production
  # behind `main`, which is the failure the assertions further down exist to
  # catch and is far more expensive.
  #
  # Expected consequence, so it is not later misread as drift: after a skipped
  # deploy the production alias points at the deployment built from the last
  # commit that touched these paths, not at `main`'s tip. The bundle it serves
  # is byte-identical either way, which is the whole reason the deploy was
  # skipped. Only the commit stamp differs. The backend is unaffected: Render
  # deploys the API from its own trigger on every push, independently of this.
  changes:
    name: Detect deployable changes
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      deployable: ${{ steps.filter.outputs.deployable }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Decide whether this push can change the deployed bundle
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Previous commit unavailable; deploying rather than guessing."
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$BEFORE" "$GITHUB_SHA")"
          echo "Changed files:"
          echo "$changed" | sed 's/^/  /'

          # `shared/` is here because the frontend imports @shared/types and the
          # build inlines it. `vercel.json` and this workflow both change how the
          # deployment is produced. The three root files are build inputs Vercel
          # reads even when nothing under `frontend/` moved: `bun.lock` and the
          # root `package.json` are what `installCommand: bun install` resolves
          # against, and `frontend/tsconfig.json` extends `../tsconfig.json`, so
          # `tsc -b` reads the root one. Each alternative is anchored by the
          # leading `^`, so `backend/package.json` still skips correctly.
          if echo "$changed" | grep -qE '^(frontend/|shared/|vercel\.json$|bun\.lock$|package\.json$|tsconfig\.json$|\.github/workflows/ci\.yml$)'; then
            echo "deployable=true" >> "$GITHUB_OUTPUT"
            echo "Deployable paths touched."
          else
            echo "deployable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deployable paths changed; skipping the Vercel deployment."
          fi

  deploy:
    name: Deploy to Vercel
    needs: [verify, changes]
    if: needs.changes.outputs.deployable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Identifiers, not credentials: they appear in Vercel dashboard URLs.
      # Only VERCEL_TOKEN is secret, which keeps the setup burden to one secret.
      VERCEL_ORG_ID: team_CwktsdBSB9TLrdwdCV3dZRbg
      VERCEL_PROJECT_ID: prj_6QNJo1XWj70DACDO3F0ICVSJkQTF
      # The domain a reviewer actually visits, and the origin the API trusts for
      # CORS and cookies (docs/trd.md §14). Asserting against the deployment's
      # own URL would prove nothing: that URL always resolves to the deployment.
      PRODUCTION_DOMAIN: catatmd.vercel.app

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # Pinned rather than @latest: the deploy path should not change under us
      # between one merge and the next.
      - name: Install Vercel CLI
        run: npm install --global vercel@54.12.0

      - name: Pull production project settings
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Builds with the settings just pulled, so CI cannot drift from what the
      # dashboard would have done. The build command itself lives in
      # vercel.json, in the repo, rather than in dashboard state.
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # This exact failure has shipped twice. `VITE_API_URL` is read at build
      # time and inlined, so if it is missing the bundle falls back to a
      # relative base, every call lands on the static origin, and the SPA
      # rewrite answers `POST /api/...` with 405 text/html. The client cannot
      # parse that as an error envelope, so the only symptom a user sees is
      # "Something went wrong" on a site that is otherwise up. Nothing else in
      # the pipeline notices: the build succeeds and the deploy is healthy.
      #
      # The cause both times was the variable being marked Sensitive in the
      # dashboard. Sensitive values are write-only, so `vercel pull` returns
      # the literal string `[SENSITIVE]` and the prebuilt build never sees the
      # URL. It is a public value that ships inside client JavaScript, so
      # Sensitive buys nothing and costs the deploy.
      - name: Assert the bundle points at the API, not the static origin
        run: |
          api="$(sed -n 's/^VITE_API_URL="\?\([^"]*\)"\?$/\1/p' .vercel/.env.production.local)"
          case "$api" in
            '' | '[SENSITIVE]')
              echo "::error::VITE_API_URL did not reach the build (got '${api:-<unset>}')."
              echo "If it reads [SENSITIVE], clear the flag:"
              echo "  vercel env rm VITE_API_URL production --yes"
              echo "  vercel env add VITE_API_URL production --no-sensitive --value <url>"
              exit 1
              ;;
          esac
          if ! grep -rqF "$api" .vercel/output/static/assets; then
            echo "::error::Built bundle does not contain $api, so the API base is empty."
            exit 1
          fi
          echo "Bundle is wired to $api"

      # `--meta commitSha` is set explicitly rather than relying on the CLI's git
      # auto-detection, because the identity check below reads it back and must
      # not depend on how the CLI happened to infer provenance.
      #
      # `--no-wait` because `vercel deploy` blocks silently on a deployment
      # Vercel has refused to build: observed 13/08/26 on 511de77, which sat 14
      # minutes at "Building..." and then hit the job timeout. GitHub reports a
      # timed-out job as "cancelled", which is indistinguishable at a glance
      # from a superseded run, so the real cause was invisible. The readiness
      # check below owns the waiting instead, bounded and with a named verdict.
      - name: Deploy prebuilt output
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --no-wait \
            --meta commitSha="$GITHUB_SHA" \
            --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Created: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # A deployment that never becomes READY must fail here, loudly and with a
      # reason, rather than surfacing later as a confusing alias mismatch.
      - name: Wait for the deployment to be ready
        timeout-minutes: 10
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          host="${DEPLOYMENT_URL#https://}"
          url="https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID"

          state=""
          for _ in $(seq 1 54); do
            body="$(curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$url")"
            state="$(printf '%s' "$body" | jq -r '.readyState // empty')"
            case "$state" in
              READY)
                echo "Deployment is ready."
                exit 0
                ;;
              BLOCKED)
                author="$(printf '%s' "$body" | jq -r '.meta.githubCommitAuthorName // "unknown"')"
                echo "::error::Vercel refused to build this deployment (BLOCKED). Commit author: $author. Production has NOT been updated. Every BLOCKED deployment on this project so far, over both the Git integration and this CLI path, has been for a commit authored by someone other than the Vercel account owner, which is the Hobby plan's collaborator restriction. That is a plan decision, not something this workflow can fix."
                exit 1
                ;;
              ERROR | CANCELED)
                echo "::error::Deployment ended in state $state. Production has NOT been updated."
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "::error::Deployment never became READY (last state: ${state:-unknown})."
          exit 1

      # The step the whole job exists for.
      #
      # `vercel deploy --prod` does not move catatmd.vercel.app onto the new
      # deployment, and the reason is configuration rather than flakiness: that
      # hostname is an alias owned by this project but it is NOT one of the
      # project's assigned domains. The only assigned domain is
      # ai-clinical-assistant-ten.vercel.app, so that is what Vercel auto-assigns
      # on every production deploy, alongside the per-deployment default URL.
      # catatmd.vercel.app is left wherever it last pointed. This is also why
      # `vercel promote` once returned 409 "already the current production
      # deployment": the deployment genuinely was production and correctly
      # aliased to its assigned domain. The stale hostname was the unmanaged one.
      #
      # So the alias set below is not a workaround for an unreliable platform,
      # it is the step that actually publishes the reviewer-facing URL. The
      # durable fix is to add catatmd.vercel.app to the project's domains, after
      # which Vercel assigns it automatically and this step becomes a safety net.
      #
      # Identity, not content, is what this asserts. Content alone is
      # insufficient: a backend-only or docs-only commit
      # produces a byte-identical bundle, so a stale alias still serves the
      # expected hash. Comparing deployment ids is exact in both directions, and
      # it stays correct if Vercel ever deduplicates an identical build, because
      # the deploy step then returns that same deployment and the ids still match.
      - name: Assert the production domain serves this deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          api() { curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "$1"; }
          host="${DEPLOYMENT_URL#https://}"

          deployed_id="$(api \
            "https://api.vercel.com/v13/deployments/$host?teamId=$VERCEL_ORG_ID" \
            | jq -r '.id // empty')"
          if [ -z "$deployed_id" ]; then
            echo "::error::Could not resolve the deployment just created ($host)"
            exit 1
          fi
          echo "Deployed $deployed_id from $GITHUB_SHA"

          alias_target() {
            api "https://api.vercel.com/v4/aliases/$PRODUCTION_DOMAIN?teamId=$VERCEL_ORG_ID" \
              | jq -r '.deploymentId // empty'
          }

          # Set unconditionally rather than polling first and repairing on a
          # miss. `vercel alias set` is idempotent, so this costs nothing when
          # the domain is already correct, and it avoids waiting out a poll for
          # movement that will not happen while the domain is unassigned.
          vercel alias set "$DEPLOYMENT_URL" "$PRODUCTION_DOMAIN" --token="$VERCEL_TOKEN"

          # Assignment is not instant, so a first miss is not yet a failure.
          for _ in 1 2 3 4 5 6; do
            [ "$(alias_target)" = "$deployed_id" ] && {
              echo "$PRODUCTION_DOMAIN resolves to this deployment."
              exit 0
            }
            sleep 10
          done

          live="$(alias_target)"
          echo "::error::$PRODUCTION_DOMAIN still resolves to ${live:-an unknown deployment}, not $deployed_id. The deploy reported success and the domain could not be pointed at it."
          exit 1

      # Confirmation, not the gate. If the ids match but the bytes do not, the
      # deployment itself is wrong rather than the alias, which is a different
      # fault and worth naming separately.
      - name: Confirm the served bundle matches the build
        run: |
          set -euo pipefail

          expected="$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' \
            .vercel/output/static/index.html | head -1)"
          if [ -z "$expected" ]; then
            echo "::warning::Could not fingerprint the build output; skipping byte confirmation"
            exit 0
          fi

          for _ in 1 2 3; do
            if curl -fsSL --max-time 20 "https://$PRODUCTION_DOMAIN/" | grep -qF "$expected"; then
              echo "$PRODUCTION_DOMAIN serves $expected."
              exit 0
            fi
            sleep 10
          done

          echo "::error::$PRODUCTION_DOMAIN resolves to the right deployment but is not serving $expected."
          exit 1
