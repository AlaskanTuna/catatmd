<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="font.css" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 72px 80px;
        background-color: #136a51;
        background-image: url('og-bg.png');
        background-size: cover;
        background-position: center;
        font-family: 'Outfit', system-ui, sans-serif;
        color: #ffffff;
      }
      .lockup { display: flex; align-items: center; gap: 18px; }
      .wordmark {
        display: inline-flex;
        align-items: center;
        font-weight: 600;
        font-size: 46px;
        line-height: 1;
        letter-spacing: -0.005em;
      }
      .badge { margin-left: 0.15em; height: 0.78em; width: auto; }
      .claim {
        max-width: 20ch;
        font-size: 62px;
        font-weight: 600;
        line-height: 1.12;
        letter-spacing: -0.018em;
      }
      .foot {
        display: flex;
        align-items: center;
        gap: 14px;
        font-size: 22px;
        line-height: 1;
        color: rgba(255, 255, 255, 0.82);
      }
      .dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,0.45); }
    </style>
  </head>

</html>
