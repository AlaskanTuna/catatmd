services:
  - type: web
    name: catatmd-api
    runtime: node
    region: singapore
    plan: free
    buildCommand: bun install && bun run --cwd shared build && bunx prisma generate --schema prisma/schema.prisma && bun run --cwd backend build
    startCommand: bun run --cwd backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      # Vercel's egress addresses (#156). The SPA reaches this API through a
      # Vercel rewrite, so Cloudflare reports Vercel as the peer and the real
      # caller is the leftmost x-forwarded-for entry. Set in the dashboard
      # rather than here because Vercel can rotate them. Left unset, the rate
      # limiters degrade to one shared bucket for proxied traffic, never to a
      # spoofable one.
      - key: TRUSTED_PROXY_IPS
        sync: false
      - key: LLM_PROVIDER
        value: qwen
      - key: QWEN_API_KEY
        sync: false
      - key: QWEN_BASE_URL
        value: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
      - key: QWEN_MODEL
        value: qwen3.7-flash
      # Hosted-ASR relay (#154). Key only: base URL and model ride the defaults
      # in backend/src/config/env.ts. Remember this file is not authoritative
      # for a live service; set the key in the dashboard (docs/trd.md §17).
      - key: ILMU_API_KEY
        sync: false
      - key: DEID_FAIL_CLOSED
        value: 'true'
      # Verbosity only. No level widens what may be written: redaction in
      # backend/src/lib/logger.ts is unconditional, and there is deliberately
      # no flag that unlocks raw clinical content (GitHub issue #15).
      - key: LOG_LEVEL
        value: info
      # Guest sign-in (#29). Credentials stay server-side — the /api/auth/guest
      # route exchanges them for a real session, so the demo password is never
      # in the SPA bundle. Without these set in the dashboard the guest button
      # 404s in production, and the seed must be run against prod once.
      - key: GUEST_EMAIL
        sync: false
      - key: GUEST_PASSWORD
        sync: false
      - key: SEED_DOCTOR_PASSWORD
        sync: false
